<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotify Web Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
</head>

<body>

<div class="container flex bg-black">

    <!-- LEFT PANEL -->
    <div class="left">

        <div class="home bg-grey rounded m-1 p-1">
            <div class="logo">
                <img class="invert" src="img/logo.svg" alt="">
            </div>

            <ul>
                <li><img class="invert" src="img/home.svg">Home</li>
                <li><img class="invert" src="img/search.svg">Search</li>
            </ul>
        </div>

        <div class="library bg-grey rounded m-1 p-1">
            <h2>Your Library</h2>

            <div class="songlist">
                <ul></ul>
            </div>
        </div>

    </div>

    <!-- RIGHT PANEL -->
    <div class="right bg-grey round">

        <div class="header">
            <div></div>
            <div class="buttons">
                <button class="signupbtn">Sign up</button>
                <button class="loginbtn">Log in</button>
            </div>
        </div>

        <!-- ALBUMS -->
        <div class="spotifyPlaylists">
            <h1>Spotify Playlists</h1>
            <div class="cardContainer"></div>
        </div>

    </div>

</div>

<!-- PLAYBAR OUTSIDE PLAYLIST SECTION -->
<div class="playbar">

    <!-- SEEK BAR -->
    <div class="seekbar">
        <div class="circle"></div>
    </div>

    <div class="abovebar">

        <div class="songinfo">No song selected</div>

        <div class="songbuttons">
            <img id="previous" src="img/preview.svg" alt="">
            <img id="play" src="img/play.svg" alt="">
            <img id="next" src="img/next.svg" alt="">
        </div>

        <div class="timevol">

            <div class="songtime">00:00 / 00:00</div>

            <div class="volume">
                <img width="25" src="img/volume.svg" alt="">
                <input type="range"
                       id="volume"
                       min="0"
                       max="100"
                       value="100">
            </div>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
