<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotify - Web Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
</head>

<body>

<div class="container flex bg-black">

    <!-- LEFT SIDE -->
    <div class="left">

        <div class="close">
            <img width="30" class="invert" src="img/close.svg" alt="">
        </div>

        <div class="home bg-grey rounded m-1 p-1">
            <div class="logo">
                <img class="invert" src="img/logo.svg" alt="logo">
            </div>

            <ul>
                <li><img class="invert" src="img/home.svg">Home</li>
                <li><img class="invert" src="img/search.svg">Search</li>
            </ul>
        </div>

        <div class="library bg-grey rounded m-1 p-1">
            <div class="heading">
                <h2>Your Library</h2>
            </div>

            <div class="songlist">
                <ul></ul>
            </div>

        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right bg-grey round">

        <div class="header">
            <div class="nav">
                <div class="hamburgerContainer">
                    <img width="40" class="invert hamburger" src="img/hambarger.svg">
                </div>
            </div>

            <div class="buttons">
                <button class="signupbtn">Sign up</button>
                <button class="loginbtn">Log in</button>
            </div>
        </div>

        <!-- ALBUM CARDS -->
        <div class="spotifyPlaylists">
            <h1>Spotify Playlists</h1>
            <div class="cardContainer"></div>
        </div>

        <!-- PLAYBAR -->
        <div class="playbar">

            <!-- SEEK BAR -->
            <div class="seekbar">
                <div class="circle"></div>
            </div>

            <div class="abovebar">

                <div class="songinfo"></div>

                <div class="songbuttons">
                    <img id="previous" src="img/preview.svg">
                    <img id="play" src="img/play.svg">
                    <img id="next" src="img/next.svg">
                </div>

                <div class="timevol">

                    <div class="songtime">00:00 / 00:00</div>

                    <div class="volume">
                        <img width="25" src="img/volume.svg">
                        <div class="range">
                            <input type="range" min="0" max="100" value="100" id="volume">
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
